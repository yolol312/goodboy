<!doctype html>
<!--
  BAD fixture. Seeded accessibility defects:
    1. icon-only button with NO accessible name (no aria-label / no text).
    2. inputs with NO associated <label> (and no aria-label / placeholder-as-label).
    3. global `*:focus { outline: none }` with NO replacement focus indicator.
  Expected review finding: dimension ui-ux-accessibility, severity medium.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Search</title>
    <style>
      * { box-sizing: border-box; }
      body { font-family: sans-serif; margin: 2rem; }
      /* DEFECT 3: removes the focus ring with no visible replacement */
      *:focus { outline: none; }
      .row { display: flex; gap: 8px; align-items: center; }
      input { padding: 8px; border: 1px solid #999; }
      button { padding: 8px 10px; border: 1px solid #999; background: #eee; }
    </style>
  </head>
  <body>
    <h1>Search</h1>
    <form class="row" action="#" method="get">
      <!-- DEFECT 2: no <label for> for either input -->
      <input type="text" name="q" />
      <input type="text" name="tag" />
      <!-- DEFECT 1: icon-only button, no accessible name -->
      <button type="submit">🔍</button>
    </form>
  </body>
</html>
